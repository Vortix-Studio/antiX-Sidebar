name: Build C++

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa CMake e compilatore
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configura
        run: cmake -S . -B build

      - name: Compila
        run: cmake --build build
