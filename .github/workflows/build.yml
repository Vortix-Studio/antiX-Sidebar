name: Build C++

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libgtk-3-dev libcairo2-dev libx11-dev libcurl4-openssl-dev

      - name: Configura
        run: cmake -S . -B build

      - name: Compila
        run: cmake --build build
